<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>函館市電 AR</title>
  <link rel="stylesheet" href="style.css?v=10">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="frame"></canvas>
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <div id="start">
    <h1>函館市電 AR</h1>
    <p>段ボールの線路をカメラに写すと<br>電車が走ってきます</p>
    <button id="startBtn" disabled>読み込み中…</button>
    <p id="loadMsg" class="small"></p>
  </div>

  <div id="status" hidden></div>

  <div id="debugPanel" hidden>
    <label>線の感度 <input id="thresh" type="range" min="10" max="60" value="25"><span id="threshVal">25</span></label>
    <label>焦点 <input id="focal" type="range" min="50" max="120" value="75"><span id="focalVal">自動</span></label>
    <label><input id="focalAuto" type="checkbox" checked> 焦点を自動で合わせる</label>
    <div id="debugInfo"></div>
    <canvas id="maskView"></canvas>
  </div>
  <button id="debugBtn" hidden>DEBUG</button>

  <script type="module" src="main.js?v=10"></script>
</body>
</html>
