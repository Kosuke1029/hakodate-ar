<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>まちを歩く | 大門AR</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui a, #ui button { pointer-events: auto; }

    #back { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px;
      padding: 8px 14px; border-radius: 999px; background: rgb(0 0 0 / 0.45); color: #fff;
      text-decoration: none; font-size: 14px; }
    #msg { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      max-width: calc(100% - 32px); box-sizing: border-box; padding: 10px 18px; border-radius: 999px;
      background: rgb(0 0 0 / 0.55); font-size: 14px; line-height: 1.5; text-align: center; }

    #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; pointer-events: auto;
      background: #1e2a3a url('img/home_bg.jpg') center 35% / cover no-repeat; }
    #start::before { content: ""; position: absolute; inset: 0; background: rgb(15 23 42 / 0.55); }
    #start > * { position: relative; }
    #start[hidden], #msg[hidden], #simpleBtn[hidden] { display: none; }
    #start h1 { margin: 0; font-size: 30px; letter-spacing: 0.04em; }
    #start p { margin: 0; line-height: 1.7; color: #e5e7eb; }
    #start .small { font-size: 13px; color: #cbd5e1; }
    #startBtn { margin-top: 8px; padding: 14px 34px; border: 0; border-radius: 999px; background: #fff; color: #111827;
      font-size: 17px; font-weight: 700; }
    #startBtn:disabled { opacity: 0.6; }
    #simpleBtn { border: 0; background: none; color: #cbd5e1; font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>

  <!-- WebXR 中もこの中は表示される (dom-overlay) -->
  <div id="ui">
    <a id="back" href="home.html">← もどる</a>
    <div id="msg" hidden></div>

    <div id="start">
      <h1>まちを歩く</h1>
      <p>みんなが作ったキャラクターが<br>カメラに写った地面の上を歩きます</p>
      <p id="info" class="small">キャラクターを読み込んでいます…</p>
      <button id="startBtn" disabled>読み込み中…</button>
      <button id="simpleBtn" hidden>かんたんモード (カメラ映像の上に表示)</button>
    </div>
  </div>

  <!-- avatar-style.js → models.js (普通の script) を読んでから walk.js (module) -->
  <script src="js/avatar-style.js"></script>
  <script src="js/models.js"></script>
  <script type="module" src="js/walk.js"></script>
</body>
</html>
